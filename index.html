<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nocturna" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Nocturna — Curadoria de Terror &amp; Thriller</title>
    <meta
      name="description"
      content="Descubra filmes de terror e thriller passando capas, com nota do IMDb, sinopse breve, filtros avançados e curadoria de raridades."
    />
    <meta property="og:title" content="Nocturna — Curadoria de Terror &amp; Thriller" />
    <meta
      property="og:description"
      content="Descubra filmes de terror e thriller passando capas, com nota do IMDb, sinopse breve, filtros avançados e curadoria de raridades."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var appParam = new URLSearchParams(window.location.search).get('app');
        var storedApp = window.localStorage.getItem('cinema:active-universe');
        if (appParam === 'matine' || appParam === 'romcom' || (!appParam && storedApp === 'matine')) {
          document.documentElement.classList.remove('dark');
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute('content', '#F0E3DC');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#F4EAE4] text-[#2D1E25] dark:bg-[#09090B] dark:text-[#F4F4F5] antialiased selection:bg-[#BE3A5E]/20 selection:text-[#2D1E25] dark:selection:bg-rose-600/30 dark:selection:text-rose-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
